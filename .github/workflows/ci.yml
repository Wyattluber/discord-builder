name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run bundle
      - name: dist/ is committed and current
        run: git diff --exit-code --stat -- dist || (echo "Run npm run bundle and commit dist/." && exit 1)
      - run: npm test
